# Home Assistant copies `custom_components/thames_water` into a config
# directory, so there is nothing here to build or install. This file carries
# the test configuration and the dependencies a test run needs.

[dependency-groups]
test = [
    # Brings Home Assistant itself, pytest and the fixtures a custom
    # integration is tested against, so the Home Assistant version under test
    # comes from here rather than being pinned separately.
    "pytest-homeassistant-custom-component==0.13.316",
    # The integration's own requirement, which `manifest.json` states for
    # Home Assistant to install at runtime and nothing installs for a test
    # run.
    "thameswaterapi>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
